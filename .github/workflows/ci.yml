name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: build · types · tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      # The plugin's @deepseek-ai/* peers are pinned to the harness line it was
      # developed against; a floating install would test against a different
      # harness than the one the types were read from.
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
